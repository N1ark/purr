name: Release

# A pushed `vX.Y.Z` tag (from `npm run release`) becomes a GitHub release, its notes the
# changelog section of that version. Run by hand, it tags the `Release X.Y.Z` commit itself,
# for when the tag can't be pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (0.5.2)"
        required: true
      commit:
        description: "Its `Release X.Y.Z` commit (full SHA)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.ref }}

      - name: The commit is that version
        if: inputs.version
        run: |
          test "$(node -p 'require("./package.json").version')" = "${TAG#v}" \
            || { echo "package.json at ${{ inputs.commit }} is not ${TAG#v}"; exit 1; }

      - name: Notes from the changelog
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $version"; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "purr ${TAG#v}" --notes-file notes.md
